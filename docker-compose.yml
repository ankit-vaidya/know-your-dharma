services:

  # ============================================================
  # PostgreSQL - System of Record
  # ============================================================
  postgres:
    image: postgres:17.10-bookworm
    container_name: kyd-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - kyd-network

    mem_limit: 512m


  # ============================================================
  # Redis - Cache + Queue
  # ============================================================
  redis:
    image: redis:8.8.1-alpine
    container_name: kyd-redis
    restart: unless-stopped

    command:
      - sh
      - -c
      - 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - kyd-network

    mem_limit: 256m


  # ============================================================
  # Qdrant - Vector Database
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: kyd-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - kyd-network

    mem_limit: 512m


# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:

  postgres_data:
    name: kyd-postgres-data

  redis_data:
    name: kyd-redis-data

  qdrant_data:
    name: kyd-qdrant-data


# ==============================================================
# Internal Network
# ==============================================================

networks:

  kyd-network:
    name: kyd-network
    driver: bridge